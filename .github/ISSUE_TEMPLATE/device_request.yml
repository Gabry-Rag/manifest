name: SevenLab Device Accreditation Request
description: Richiesta strutturata di accreditamento hardware o sostituzione postazione (il payload viene redatto e chiuso automaticamente entro pochi secondi).
title: "[Device Request] "
labels: ["device-request"]
body:
  - type: markdown
    attributes:
      value: |
        Incolla l'envelope JSON cifrato `7LS1` (`v2`) generato dal client SevenLab. La issue verrà automaticamente sanificata e chiusa dal gateway crittografico.
  - type: textarea
    id: payload
    attributes:
      label: Payload Accreditamento (JSON)
      description: Envelope cifrato v2 (`{"v":2,"sealed":"..."}`) generato dal client SevenLab. I payload plaintext non sono accettati.
      render: json
    validations:
      required: true
