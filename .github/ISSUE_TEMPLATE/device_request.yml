name: SevenLab Device Accreditation Request
description: Richiesta strutturata di accreditamento hardware o sostituzione postazione (il payload viene redatto e chiuso automaticamente entro pochi secondi).
title: "[Device Request] "
labels: ["device-request"]
body:
  - type: markdown
    attributes:
      value: |
        Incolla il payload JSON generato dal client SevenLab (envelope cifrato `v2` oppure payload 4D). La issue verrà automaticamente sanificata e chiusa dal gateway crittografico.
  - type: textarea
    id: payload
    attributes:
      label: Payload Accreditamento (JSON)
      description: Envelope cifrato v2 (`{"v":2,"sealed":"..."}`) oppure payload 4D con machine_hash e hardware_vector.
      render: json
    validations:
      required: true
